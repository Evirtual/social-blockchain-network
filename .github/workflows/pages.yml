name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /
          VITE_CONTRACT_ADDRESS_ETH: ${{ vars.VITE_CONTRACT_ADDRESS_ETH }}
          VITE_CONTRACT_ADDRESS_SEPOLIA: ${{ vars.VITE_CONTRACT_ADDRESS_SEPOLIA }}
          VITE_CONTRACT_ADDRESS_BASE: ${{ vars.VITE_CONTRACT_ADDRESS_BASE }}
          VITE_CONTRACT_ADDRESS_BASE_SEPOLIA: ${{ vars.VITE_CONTRACT_ADDRESS_BASE_SEPOLIA }}
          VITE_CONTRACT_ADDRESS_BSC: ${{ vars.VITE_CONTRACT_ADDRESS_BSC }}
          VITE_CONTRACT_ADDRESS_BSC_TESTNET: ${{ vars.VITE_CONTRACT_ADDRESS_BSC_TESTNET }}
          VITE_CONTRACT_ADDRESS_LOCAL: ${{ vars.VITE_CONTRACT_ADDRESS_LOCAL }}
          VITE_LOCAL_RPC_URL: ${{ vars.VITE_LOCAL_RPC_URL }}
          VITE_LOCAL_RPC_WS_URL: ${{ vars.VITE_LOCAL_RPC_WS_URL }}
          VITE_ETH_RPC_URL: ${{ vars.VITE_ETH_RPC_URL }}
          VITE_ETH_RPC_WS_URL: ${{ vars.VITE_ETH_RPC_WS_URL }}
          VITE_ETH_SEPOLIA_RPC_URL: ${{ vars.VITE_ETH_SEPOLIA_RPC_URL }}
          VITE_ETH_SEPOLIA_RPC_WS_URL: ${{ vars.VITE_ETH_SEPOLIA_RPC_WS_URL }}
          VITE_BASE_RPC_URL: ${{ vars.VITE_BASE_RPC_URL }}
          VITE_BASE_RPC_WS_URL: ${{ vars.VITE_BASE_RPC_WS_URL }}
          VITE_BASE_SEPOLIA_RPC_URL: ${{ vars.VITE_BASE_SEPOLIA_RPC_URL }}
          VITE_BASE_SEPOLIA_RPC_WS_URL: ${{ vars.VITE_BASE_SEPOLIA_RPC_WS_URL }}
          VITE_BSC_RPC_URL: ${{ vars.VITE_BSC_RPC_URL }}
          VITE_BSC_RPC_WS_URL: ${{ vars.VITE_BSC_RPC_WS_URL }}
          VITE_BSC_TESTNET_RPC_URL: ${{ vars.VITE_BSC_TESTNET_RPC_URL }}
          VITE_BSC_TESTNET_RPC_WS_URL: ${{ vars.VITE_BSC_TESTNET_RPC_WS_URL }}
          VITE_ETH_SUBGRAPH_URL: ${{ vars.VITE_ETH_SUBGRAPH_URL }}
          VITE_ETH_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_ETH_SEPOLIA_SUBGRAPH_URL }}
          VITE_BASE_SUBGRAPH_URL: ${{ vars.VITE_BASE_SUBGRAPH_URL }}
          VITE_BASE_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_BASE_SEPOLIA_SUBGRAPH_URL }}
          VITE_BSC_SUBGRAPH_URL: ${{ vars.VITE_BSC_SUBGRAPH_URL }}
          VITE_BSC_TESTNET_SUBGRAPH_URL: ${{ vars.VITE_BSC_TESTNET_SUBGRAPH_URL }}
          VITE_ETH_EXPLORER_BASE_URL: ${{ vars.VITE_ETH_EXPLORER_BASE_URL }}
          VITE_ETH_SEPOLIA_EXPLORER_BASE_URL: ${{ vars.VITE_ETH_SEPOLIA_EXPLORER_BASE_URL }}
          VITE_BASE_EXPLORER_BASE_URL: ${{ vars.VITE_BASE_EXPLORER_BASE_URL }}
          VITE_BASE_SEPOLIA_EXPLORER_BASE_URL: ${{ vars.VITE_BASE_SEPOLIA_EXPLORER_BASE_URL }}
          VITE_BSC_EXPLORER_BASE_URL: ${{ vars.VITE_BSC_EXPLORER_BASE_URL }}
          VITE_BSC_TESTNET_EXPLORER_BASE_URL: ${{ vars.VITE_BSC_TESTNET_EXPLORER_BASE_URL }}
          VITE_IPFS_GATEWAY: ${{ vars.VITE_IPFS_GATEWAY }}
          VITE_PINATA_WORKER_URL: ${{ vars.VITE_PINATA_WORKER_URL }}
          VITE_SUBGRAPH_LOG: ${{ vars.VITE_SUBGRAPH_LOG }}
          VITE_SUBGRAPH_LOG_SUMMARY_EVERY: ${{ vars.VITE_SUBGRAPH_LOG_SUMMARY_EVERY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
