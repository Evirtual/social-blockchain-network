name: CI

# Runs on every push, including branches that never deploy. The Pages workflow
# only builds main, so without this nothing enforces the type checks or the
# test suite.
#
# Deliberately not also on pull_request: with both triggers an open PR gets two
# identical runs, because the concurrency group below keys on github.ref, which
# differs between the two events (refs/heads/<branch> vs refs/pull/<n>/merge) and
# so never collapses them. Checks attach to the commit SHA, so a PR still shows
# these results. The trade is that CI tests the branch tip rather than the
# prospective merge, and PRs opened from forks would get no run - add
# pull_request back, guarded to forks only, if this repo ever takes outside
# contributions.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; superseded pushes are cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck before tests: a type error explains a failing suite, and the
      # reverse ordering buries it under unrelated test noise.
      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Test
        run: npm run test:frontend

      # The build is what Pages deploys. Catching a build break here means it
      # never reaches the deploy workflow.
      - name: Build
        run: npm run build
        env:
          VITE_ETH_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_ETH_SEPOLIA_SUBGRAPH_URL }}
          VITE_BASE_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_BASE_SEPOLIA_SUBGRAPH_URL }}
          VITE_BSC_TESTNET_SUBGRAPH_URL: ${{ vars.VITE_BSC_TESTNET_SUBGRAPH_URL }}

  workers:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The workers have their own tsconfig and are not covered by the
      # frontend build, so a break there is otherwise only found on deploy.
      - name: Typecheck workers
        run: npx tsc --noEmit -p workers/tsconfig.json

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install contract dependencies
        run: npm --prefix contracts ci

      - name: Test
        run: npm --prefix contracts test
