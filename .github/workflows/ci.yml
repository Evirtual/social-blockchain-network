name: CI

# pull_request does the real work here. It fires when a PR opens and again on
# every push to it, and it tests the branch *merged into main* rather than the
# branch alone - so a change that only breaks in combination with what landed on
# main in the meantime is caught before the merge instead of after it.
#
# push on main is the safety net: it re-runs the suite on the merge commit, and
# covers anything that reaches main by another route.
#
# Deliberately not push on every branch as well. With both triggers an open PR
# gets two identical runs, and the concurrency group below cannot collapse them
# because it keys on github.ref, which differs between the events
# (refs/heads/<branch> for a push vs refs/pull/<n>/merge for a PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; superseded pushes are cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck before tests: a type error explains a failing suite, and the
      # reverse ordering buries it under unrelated test noise.
      - name: Typecheck
        run: npx tsc -b --pretty false

      # 46 import cycles were removed by importing concrete modules instead of
      # barrels. A new one is added by accident and stays invisible until
      # something initialises in the wrong order, so hold the count at zero.
      - name: Check import cycles
        run: npm run check:cycles

      - name: Test
        run: npm run test:frontend

      # The build is what Pages deploys. Catching a build break here means it
      # never reaches the deploy workflow.
      - name: Build
        run: npm run build
        env:
          VITE_ETH_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_ETH_SEPOLIA_SUBGRAPH_URL }}
          VITE_BASE_SEPOLIA_SUBGRAPH_URL: ${{ vars.VITE_BASE_SEPOLIA_SUBGRAPH_URL }}
          VITE_BSC_TESTNET_SUBGRAPH_URL: ${{ vars.VITE_BSC_TESTNET_SUBGRAPH_URL }}

  workers:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The workers have their own tsconfig and are not covered by the
      # frontend build, so a break there is otherwise only found on deploy.
      - name: Typecheck workers
        run: npx tsc --noEmit -p workers/tsconfig.json

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install contract dependencies
        run: npm --prefix contracts ci

      - name: Test
        run: npm --prefix contracts test
