type Post @entity(immutable: false) {
  id: ID!

  tokenId: String!
  author: Bytes!
  tokenURI: String!
  title: String!
  body: String!

  mintTxHash: Bytes
  mintBlockNumber: BigInt!
  mintTimestamp: BigInt

  likes: BigInt!
  comments: BigInt!
  saves: BigInt!
  tipsWei: BigInt!

  frozenAtBlock: BigInt
  edited: Boolean!
  editedAtBlock: BigInt

  burnedAtBlock: BigInt
  updatedAtBlock: BigInt
}

type Account @entity(immutable: false) {
  id: ID!

  name: String
  bio: String
  avatar: String

  posterAllowed: Boolean!
  posterRequested: Boolean!
  disapprovedEver: Boolean!

  followersCount: BigInt!
  followingCount: BigInt!
  postedCount: BigInt!
  likedCount: BigInt!
  savedCount: BigInt!
  commentsCount: BigInt!
  commentLikesCount: BigInt!
  commentSavesCount: BigInt!

  # Best-effort indexed value (authoritative value is still from contract when connected).
  withdrawableWeiIndexed: BigInt!

  updatedAtBlock: BigInt
  updatedAtTimestamp: BigInt

  # Relationships
  followers: [FollowEdge!]! @derivedFrom(field: "followee")
  following: [FollowEdge!]! @derivedFrom(field: "follower")

  notifications: [Notification!]! @derivedFrom(field: "recipient")
}

type GlobalStats @entity(immutable: false) {
  id: ID!

  totalAccounts: BigInt!
  totalPosts: BigInt!
  totalLikes: BigInt!
  totalComments: BigInt!
  totalSaves: BigInt!
  totalTipsWei: BigInt!
  totalCommentLikes: BigInt!
  totalCommentSaves: BigInt!
  totalCommentTipsWei: BigInt!
  totalPostReports: BigInt!
  totalCommentReports: BigInt!
}

# Stores the current moderation recipients as indexed on-chain.
# Used by mapping handlers to fan out moderation notifications.
type ProtocolConfig @entity(immutable: false) {
  id: ID!

  # Ownable.owner() (tracked via OwnershipTransferred)
  admin: Bytes!

  # Accounts flagged via ModeratorSet events
  moderators: [Bytes!]!
}

type FollowEdge @entity(immutable: false) {
  id: ID!

  follower: Account!
  followee: Account!
  active: Boolean!

  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type LikeEdge @entity(immutable: false) {
  id: ID!

  tokenId: String!
  account: Account!
  active: Boolean!

  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type SaveEdge @entity(immutable: false) {
  id: ID!

  tokenId: String!
  account: Account!
  active: Boolean!

  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type Comment @entity(immutable: false) {
  id: ID!

  commentId: String!
  tokenId: String!
  author: Account!
  parentId: String
  comment: String!
  deleted: Boolean!
  edited: Boolean!
  likeCount: BigInt!
  saveCount: BigInt!
  tipWei: BigInt!

  createdTxHash: Bytes!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt
  updatedAtTimestamp: BigInt
}

type Tip @entity(immutable: true) {
  id: ID!

  tokenId: String!
  tipper: Account!
  author: Account!
  amountWei: BigInt!

  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type CommentLikeEdge @entity(immutable: false) {
  id: ID!

  commentId: String!
  account: Account!
  active: Boolean!

  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type CommentSaveEdge @entity(immutable: false) {
  id: ID!

  commentId: String!
  account: Account!
  active: Boolean!

  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type CommentTip @entity(immutable: true) {
  id: ID!

  tokenId: String!
  commentId: String!
  tipper: Account!
  author: Account!
  amountWei: BigInt!

  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type PostReport @entity(immutable: true) {
  id: ID!

  tokenId: String!
  reporter: Account!
  reason: String!

  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type CommentReport @entity(immutable: true) {
  id: ID!

  tokenId: String!
  commentId: String!
  reporter: Account!
  reason: String!

  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Withdrawal @entity(immutable: true) {
  id: ID!

  author: Account!
  amountWei: BigInt!

  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Notification @entity(immutable: true) {
  id: ID!

  kind: String!
  recipient: Account!
  actor: Account!

  tokenId: String!
  commentId: String

  # Only set for tip notifications (POST_TIPPED / COMMENT_TIPPED)
  amountWei: BigInt

  # Only set for protocol support (treasury cut) notifications.
  # Basis points (BPS) out of 10_000.
  supportBps: Int

  # Optional human-readable message (e.g. report reason).
  message: String

  txHash: Bytes!
  logIndex: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}
