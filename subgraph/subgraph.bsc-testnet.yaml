specVersion: 1.0.0
schema:
  file: ./schema.graphql
features:
  - ipfsOnEthereumContracts

dataSources:
  - kind: ethereum
    name: SocialPosts
    network: chapel
    source:
      abi: SocialPosts
      address: "0x4432814B9502D8ED5FDfAE8977599f4ef45D10aE" # BSC Testnet: SocialPosts
      startBlock: 83923855 # set to contract deployment block for faster indexing
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Post
        - Account
        - GlobalStats
        - ProtocolConfig
        - FollowEdge
        - LikeEdge
        - SaveEdge
        - Comment
        - CommentLikeEdge
        - CommentSaveEdge
        - CommentTip
        - PostReport
        - CommentReport
        - Tip
        - Withdrawal
        - Notification
      abis:
        - name: SocialPosts
          file: ./abis/SocialPosts.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: ModeratorSet(indexed address,indexed address,bool)
          handler: handleModeratorSet
        - event: PosterAllowed(indexed address,bool)
          handler: handlePosterAllowed
        - event: PosterAllowedBy(indexed address,indexed address,bool)
          handler: handlePosterAllowedBy
        - event: PosterApprovalRequested(indexed address)
          handler: handlePosterApprovalRequested
        - event: PosterApprovalRequestedTo(indexed address,indexed address)
          handler: handlePosterApprovalRequestedTo
        - event: ProfileUpdated(indexed address,string,string,string)
          handler: handleProfileUpdated
        - event: ProfileModerated(indexed address,indexed address,string,string,string)
          handler: handleProfileModerated
        - event: ProfileClearedByAdmin(indexed address,indexed address)
          handler: handleProfileClearedByAdmin
        - event: PostMinted(indexed address,indexed uint256,string,string,string)
          handler: handlePostMinted
        - event: PostUpdated(indexed address,indexed uint256,string,string,string)
          handler: handlePostUpdated
        - event: PostUpdatedByAdmin(indexed address,indexed address,indexed uint256,string,string,string)
          handler: handlePostUpdatedByAdmin
        - event: PostEditedStatus(indexed address,indexed uint256,bool)
          handler: handlePostEditedStatus
        - event: PostBurned(indexed address,indexed uint256)
          handler: handlePostBurned
        - event: PostBurnedByAdmin(indexed address,indexed address,indexed uint256)
          handler: handlePostBurnedByAdmin
        - event: PostFrozen(indexed address,indexed uint256)
          handler: handlePostFrozen
        - event: PostLiked(indexed address,indexed uint256)
          handler: handlePostLiked
        - event: PostUnliked(indexed address,indexed uint256)
          handler: handlePostUnliked
        - event: PostSaved(indexed address,indexed uint256)
          handler: handlePostSaved
        - event: PostUnsaved(indexed address,indexed uint256)
          handler: handlePostUnsaved
        - event: CommentAdded(indexed address,indexed uint256,indexed uint256,uint256,string)
          handler: handleCommentAdded
        - event: CommentEdited(indexed address,indexed uint256,indexed uint256,string)
          handler: handleCommentEdited
        - event: CommentDeleted(indexed address,indexed uint256,indexed uint256)
          handler: handleCommentDeleted
        - event: CommentLiked(indexed address,indexed uint256,indexed uint256)
          handler: handleCommentLiked
        - event: CommentUnliked(indexed address,indexed uint256,indexed uint256)
          handler: handleCommentUnliked
        - event: CommentSaved(indexed address,indexed uint256,indexed uint256)
          handler: handleCommentSaved
        - event: CommentUnsaved(indexed address,indexed uint256,indexed uint256)
          handler: handleCommentUnsaved
        - event: CommentTipped(indexed address,indexed address,indexed uint256,uint256,uint256)
          handler: handleCommentTipped
        - event: PostTipped(indexed address,indexed address,indexed uint256,uint256)
          handler: handlePostTipped
        - event: PostReported(indexed address,indexed uint256,string)
          handler: handlePostReported
        - event: CommentReported(indexed address,indexed uint256,indexed uint256,string)
          handler: handleCommentReported
        - event: TipsWithdrawn(indexed address,uint256)
          handler: handleTipsWithdrawn
        - event: Followed(indexed address,indexed address)
          handler: handleFollowed
        - event: Unfollowed(indexed address,indexed address)
          handler: handleUnfollowed
      file: ./src/mapping.ts
